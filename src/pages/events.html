---
title: Events
---
<article class="px-4 pb-24 pt-32 sm:px-8 sm:pt-36 lg:px-12">
    <div class="mx-auto max-w-7xl">
        <header class="max-w-4xl">
            <h1 class="site-detail-title font-semibold leading-[1.04]">Events</h1>
        </header>
        <div class="event-grid mt-12">
            {%- for event in events %}
            <div class="event-card">
                <div class="event-card-image{% if event.fit == 'contain' %} contain{% endif %}">
                    <img alt="{{ event.title }}" loading="lazy" src="{{ event.image }}">
                </div>
                <div class="event-card-body">
                    <h2 class="event-card-title">{{ event.title }}</h2>
                    <p class="event-card-description">{{ event.description }}</p>
                    <p class="event-card-participants">Participants: {{ event.participants }}</p>
                    {%- if event.href %}
                    <a class="event-card-button" href="{{ event.href }}">More info</a>
                    {%- endif %}
                </div>
            </div>
            {%- endfor %}
        </div>
    </div>
</article>
