{%- for item in nav -%}
{%- if item.children -%}
<div class="flex flex-col gap-3">
    <span class="whitespace-nowrap">{{ item.title }}</span>
    {%- for child in item.children %}
    <a class="whitespace-nowrap pl-4 transition hover:text-[var(--text)] aria-[current=page]:text-[var(--primary)]" {%
        if page.fileSlug==child.slug %} aria-current="page" {% endif %} href="{{ child.href }}">{{ child.title }}</a>
    {%- endfor %}
</div>
{%- else -%}
<a class="whitespace-nowrap transition hover:text-[var(--text)] aria-[current=page]:text-[var(--primary)]" {% if
    page.fileSlug==item.slug %} aria-current="page" {% endif %} href="{{ item.href }}">{{ item.title }}</a>
{%- endif -%}
{%- endfor -%}
