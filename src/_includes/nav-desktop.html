{%- for item in nav -%}
{%- if item.children -%}
<div class="nav-dropdown">
    <a class="nav-link whitespace-nowrap transition hover:text-[var(--text)] aria-[current=page]:text-[var(--primary)]"
        {% for child in item.children %}{% if page.fileSlug==child.slug %} aria-current="page" {% endif %}{% endfor %}
        aria-haspopup="true" href="{{ item.children[0].href }}">{{ item.title }}<svg xmlns="http://www.w3.org/2000/svg"
            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
        </svg></a>
    <div class="nav-dropdown-menu">
        {%- for child in item.children %}
        <a class="whitespace-nowrap transition hover:text-[var(--text)] aria-[current=page]:text-[var(--primary)]" {% if
            page.fileSlug==child.slug %} aria-current="page" {% endif %} href="{{ child.href }}">{{ child.title }}</a>
        {%- endfor %}
    </div>
</div>
{%- else -%}
<a class="whitespace-nowrap transition hover:text-[var(--text)] aria-[current=page]:text-[var(--primary)]" {% if
    page.fileSlug==item.slug %} aria-current="page" {% endif %} href="{{ item.href }}">{{ item.title }}</a>
{%- endif -%}
{%- endfor -%}
