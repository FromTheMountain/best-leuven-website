<header
    class="fixed inset-x-0 top-0 z-30 border-b border-black/10 bg-[var(--header)] px-4 py-2.5 text-[var(--text)] shadow-sm shadow-black/5 sm:px-8">
    <nav class="relative mx-auto flex max-w-7xl items-center justify-between gap-3"><a aria-label="BEST"
            class="flex min-w-0 shrink-0 items-center gap-3 font-semibold" href="index.html"><img
                src="img/best_leuven_logo.png" alt="BEST"
                class="h-12 w-auto max-w-[min(42vw,18rem)] object-contain sm:h-14"></a>
        <div
            class="site-text-sm hidden min-w-0 flex-1 items-center justify-end gap-5 overflow-x-auto font-medium text-[var(--muted)] md:flex">
            {% include "nav-links.html" %}</div>
        <details class="group relative shrink-0 md:hidden">
            <summary
                class="grid h-10 w-10 cursor-pointer list-none place-items-center rounded-full border border-black/10 bg-[var(--background)] text-[var(--muted)] [&amp;::-webkit-details-marker]:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-menu" aria-hidden="true">
                    <path d="M4 5h16"></path>
                    <path d="M4 12h16"></path>
                    <path d="M4 19h16"></path>
                </svg><span class="sr-only">Open navigation</span></summary>
            <div
                class="site-text-sm absolute right-0 top-[calc(100%+0.75rem)] flex max-h-[70vh] min-w-52 flex-col gap-3 overflow-y-auto rounded-2xl border border-black/10 bg-[var(--header)] p-4 font-semibold text-[var(--muted)] shadow-xl">
                {% include "nav-links.html" %}</div>
        </details>
    </nav>
</header>
